<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOP NEWS 24</title>
<meta name="description" content="DOP NEWS 24 - সর্বশেষ দেশ ও বিশ্বের সংবাদ">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,"Noto Sans Bengali","Noto Sans",sans-serif;background:#f5f5f5;color:#111}
body.rtl{direction:rtl;text-align:right}
a{text-decoration:none;color:inherit}
.container{width:94%;max-width:1250px;margin:auto}

header{background:#111;color:#fff;position:sticky;top:0;z-index:1000}
.header-main{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font-size:30px;font-weight:900;letter-spacing:-1px}
.logo span{color:#e50914}
.language{background:#222;color:#fff;border:1px solid #444;padding:9px 12px;border-radius:5px;cursor:pointer;font-size:14px}

nav{background:#222;border-top:1px solid #333}
.nav-inner{display:flex;overflow-x:auto;scrollbar-width:none}
.nav-inner::-webkit-scrollbar{display:none}
.nav-inner a{color:#fff;padding:14px 18px;white-space:nowrap;font-weight:bold;font-size:14px;cursor:pointer}
.nav-inner a:hover,.nav-inner a.active{background:#e50914}

.breaking{background:#e50914;color:#fff;overflow:hidden}
.breaking-inner{display:flex;min-height:42px;align-items:center}
.breaking-label{background:#b00008;padding:11px 15px;font-weight:bold;white-space:nowrap}
.ticker{padding-left:20px;white-space:nowrap;animation:ticker 60s linear infinite}
body.rtl .ticker{padding-left:0;padding-right:20px}
@keyframes ticker{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
body.rtl .ticker{animation-name:ticker-rtl}
@keyframes ticker-rtl{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

main{padding:25px 0 50px}
.section-title{font-size:25px;font-weight:900;border-left:6px solid #e50914;padding-left:12px;margin-bottom:20px}
body.rtl .section-title{border-left:none;border-right:6px solid #e50914;padding-left:0;padding-right:12px}

.loading{background:#fff;padding:50px 20px;text-align:center;border-radius:8px;box-shadow:0 2px 8px #0001}
.spinner{width:42px;height:42px;border:4px solid #ddd;border-top-color:#e50914;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}

.error-box{background:#fff;padding:35px 20px;text-align:center;border-radius:8px;box-shadow:0 2px 8px #0001}
.error-box h2{margin-bottom:10px}
.retry{margin-top:18px;border:0;background:#e50914;color:#fff;padding:12px 22px;border-radius:5px;cursor:pointer;font-weight:bold}

.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.news-card{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px #0001;transition:.2s;cursor:pointer}
.news-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px #0002}
.news-image{width:100%;height:200px;object-fit:cover;display:block;background:#ddd}
.news-content{padding:16px}
.news-title{font-size:20px;line-height:1.35;font-weight:800;margin-bottom:10px}
.news-description{color:#555;font-size:14px;line-height:1.6}
.news-time{color:#e50914;font-size:12px;margin-top:12px;font-weight:bold}

.featured{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:30px}
.featured-main{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px #0001;cursor:pointer}
.featured-main img{width:100%;height:400px;object-fit:cover;display:block}
.featured-text{padding:20px}
.featured-text h1{font-size:32px;line-height:1.25;margin-bottom:12px}

.side-news{display:flex;flex-direction:column;gap:15px}
.side-card{background:#fff;border-radius:8px;padding:15px;box-shadow:0 2px 8px #0001;cursor:pointer}
.side-card h3{font-size:17px;line-height:1.4}

.load-more{display:none;margin:25px auto 0;border:0;background:#e50914;color:#fff;padding:13px 30px;border-radius:5px;cursor:pointer;font-weight:bold;font-size:15px}

.modal{display:none;position:fixed;inset:0;background:#000b;z-index:2000;overflow:auto;padding:30px 15px}
.modal-box{max-width:850px;background:#fff;margin:auto;border-radius:10px;overflow:hidden;position:relative}
.modal-img{width:100%;max-height:450px;object-fit:cover;display:block}
.modal-content{padding:25px}
.modal-content h2{font-size:30px;line-height:1.3;margin-bottom:15px}
.modal-content p{font-size:17px;line-height:1.9;color:#333;white-space:pre-line}
.close{position:absolute;right:20px;top:15px;color:#fff;font-size:35px;cursor:pointer;text-shadow:0 0 8px #000;z-index:10}
body.rtl .close{right:auto;left:20px}

footer{background:#111;color:#fff;padding:35px 0;margin-top:30px;text-align:center}
footer p{color:#aaa;margin-top:8px}

.empty{padding:30px;text-align:center;color:#888;background:#fff;border-radius:8px}

@media(max-width:900px){
.news-grid{grid-template-columns:repeat(2,1fr)}
.featured{grid-template-columns:1fr}
.featured-main img{height:300px}
}
@media(max-width:600px){
.logo{font-size:24px}
.header-main{min-height:60px}
.news-grid{grid-template-columns:1fr}
.featured-text h1{font-size:25px}
.featured-main img{height:230px}
.news-image{height:210px}
.section-title{font-size:21px}
}
</style>
</head>
<body>

<header>
<div class="container header-main">
<div class="logo">DOP <span>NEWS 24</span></div>
<select class="language" id="language">
<option value="bn">বাংলা</option>
<option value="en">English</option>
<option value="hi">हिन्दी</option>
<option value="ar">العربية</option>
<option value="ur">اردو</option>
<option value="zh">中文</option>
</select>
</div>
<nav>
<div class="container nav-inner" id="navInner"></div>
</nav>
</header>

<section class="breaking">
<div class="container breaking-inner">
<div class="breaking-label" id="breakingLabel">ব্রেকিং</div>
<div class="ticker" id="ticker">সর্বশেষ সংবাদ লোড হচ্ছে...</div>
</div>
</section>

<main class="container">
<div id="loading" class="loading">
<div class="spinner"></div>
<h2 id="loadingTitle">সংবাদ লোড হচ্ছে...</h2>
<p id="loadingSub" style="margin-top:8px;color:#777">সর্বশেষ সংবাদ সংগ্রহ করা হচ্ছে</p>
</div>

<div id="error" class="error-box" style="display:none">
<h2 id="errorTitle">সংবাদ পাওয়া যাচ্ছে না</h2>
<p id="errorText">কিছুক্ষণ পর আবার চেষ্টা করুন।</p>
<button class="retry" id="retryBtn" onclick="loadNews()">আবার চেষ্টা করুন</button>
</div>

<div id="newsArea" style="display:none">
<div class="section-title" id="mainTitle">প্রধান সংবাদ</div>
<div class="featured">
<div class="featured-main" id="featuredMain"></div>
<div class="side-news" id="sideNews"></div>
</div>
<div class="section-title" id="gridTitle">সর্বশেষ সংবাদ</div>
<div class="news-grid" id="newsGrid"></div>
<button class="load-more" id="moreBtn">আরও দেখুন</button>
</div>
</main>

<footer>
<div class="container">
<h2>DOP NEWS 24</h2>
<p id="footerDesc">সর্বশেষ দেশ ও বিশ্বের সংবাদ</p>
<p>© 2026 DOP NEWS 24</p>
</div>
</footer>

<div class="modal" id="modal">
<div class="modal-box">
<span class="close" onclick="closeModal()">&times;</span>
<img class="modal-img" id="modalImage" alt="">
<div class="modal-content">
<h2 id="modalTitle"></h2>
<div id="modalDescription"></div>
</div>
</div>
</div>

<script>
const TRANSLATIONS = {
  bn: {
    nav: { home:"হোম", bangladesh:"বাংলাদেশ", world:"বিশ্ব", politics:"রাজনীতি", economy:"অর্থনীতি", technology:"প্রযুক্তি", sports:"খেলা", entertainment:"বিনোদন", lifestyle:"লাইফস্টাইল" },

    errorTitle: "সংবাদ পাওয়া যাচ্ছে না", errorText: "কিছুক্ষণ পর আবার চেষ্টা করুন।", retry: "আবার চেষ্টা করুন",
    breaking: "ব্রেকিং", footerDesc: "সর্বশেষ দেশ ও বিশ্বের সংবাদ",

  },
  en: {
    nav: { home:"Home", bangladesh:"Bangladesh", world:"World", politics:"Politics", economy:"Economy", technology:"Technology", sports:"Sports", entertainment:"Entertainment", lifestyle:"Lifestyle" },
    mainTitle: "Top Stories", gridTitle: "Latest News",
    loadingTitle: "Loading news...", loadingSub: "Fetching the latest news",
    errorTitle: "Unable to load news", errorText: "Please try again later.", retry: "Retry",
    breaking: "BREAKING", footerDesc: "Latest national & world news",
    empty: "No news available in this category yet.",
    more: "Load more", original: "Original source",
    justNow: "Just now", minAgo: "min ago", hourAgo: "hours ago", dayAgo: "days ago"
  },
  hi: {
    nav: { home:"होम", bangladesh:"बांग्लादेश", world:"विश्व", politics:"राजनीति", economy:"अर्थव्यवस्था", technology:"प्रौद्योगिकी", sports:"खेल", entertainment:"मनोरंजन", lifestyle:"लाइफस्टाइल" },
    mainTitle: "मुख्य समाचार", gridTitle: "ताज़ा समाचार",
    loadingTitle: "समाचार लोड हो रहे हैं...", loadingSub: "ताज़ा समाचार प्राप्त किए जा रहे हैं",
    errorTitle: "समाचार उपलब्ध नहीं", errorText: "कृपया बाद में पुनः प्रयास करें।", retry: "पुनः प्रयास करें",
    breaking: "ब्रेकिंग", footerDesc: "देश और दुनिया की ताज़ा खबरें",
    empty: "इस श्रेणी में अभी कोई समाचार नहीं है।",
    more: "और देखें", original: "मूल स्रोत",
    justNow: "अभी", minAgo: "मिनट पहले", hourAgo: "घंटे पहले", dayAgo: "दिन पहले"
  },
  ar: {
    nav: { home:"الرئيسية", bangladesh:"بنغلاديش", world:"العالم", politics:"السياسة", economy:"الاقتصاد", technology:"التكنولوجيا", sports:"الرياضة", entertainment:"الترفيه", lifestyle:"نمط الحياة" },
    mainTitle: "أهم الأخبار", gridTitle: "آخر الأخبار",
    loadingTitle: "جاري تحميل الأخبار...", loadingSub: "جاري جلب آخر الأخبار",
    errorTitle: "تعذر تحميل الأخبار", errorText: "يرجى المحاولة مرة أخرى لاحقاً.", retry: "إعادة المحاولة",

    justNow: "الآن", minAgo: "دقيقة مضت", hourAgo: "ساعات مضت", dayAgo: "أيام مضت"
  },
  ur: {
    nav: { home:"ہوم", bangladesh:"بنگلہ دیش", world:"دنیا", politics:"سیاست", economy:"معیشت", technology:"ٹیکنالوجی", sports:"کھیل", entertainment:"تفریح", lifestyle:"لائف اسٹائل" },
    mainTitle: "اہم خبریں", gridTitle: "تازہ ترین خبریں",
    loadingTitle: "خبریں لوڈ ہو رہی ہیں...", loadingSub: "تازہ ترین خبریں حاصل کی جا رہی ہیں",
    errorTitle: "خبریں دستیاب نہیں", errorText: "براہ کرم بعد میں دوبارہ کوشش کریں۔", retry: "دوبارہ کوشش کریں",
    breaking: "بریکنگ", footerDesc: "ملک اور دنیا کی تازہ ترین خبریں",
    empty: "اس زمرے میں ابھی کوئی خبر نہیں ہے۔",
    more: "مزید دیکھیں", original: "اصل ماخذ",
    justNow: "ابھی", minAgo: "منٹ پہلے", hourAgo: "گھنٹے پہلے", dayAgo: "دن پہلے"
  },
  zh: {
    nav: { home:"首页", bangladesh:"孟加拉国", world:"国际", politics:"政治", economy:"经济", technology:"科技", sports:"体育", entertainment:"娱乐", lifestyle:"生活方式" },
    mainTitle: "头条新闻", gridTitle: "最新新闻",
    loadingTitle: "正在加载新闻...", loadingSub: "正在获取最新新闻",
    errorTitle: "无法获取新闻", errorText: "请稍后再试。", retry: "重试",
    breaking: "突发", footerDesc: "最新国内外新闻",
    empty: "此分类暂无新闻。",
    more: "加载更多", original: "原文来源",
    justNow: "刚刚", minAgo: "分钟前", hourAgo: "小时前", dayAgo: "天前"
  }
};

const CATEGORIES = ["হোম", "বাংলাদেশ", "বিশ্ব", "রাজনীতি", "অর্থনীতি", "প্রযুক্তি", "খেলা", "বিনোদন", "লাইফস্টাইল"];
const CAT_KEY = {
  "হোম": "home",
  "বাংলাদেশ": "bangladesh",
  "বিশ্ব": "world",
  "রাজনীতি": "politics",
  "অর্থনীতি": "economy",
  "প্রযুক্তি": "technology",
  "খেলা": "sports",
  "বিনোদন": "entertainment",
  "লাইফস্টাইল": "lifestyle"
};

const HIDE_NON_BENGALI = true; // বাংলা ভাষায় ইংরেজি শিরোনামের খবর লুকাতে true, দেখাতে false
const BN = /[\u0980-\u09FF]/;
const PAGE_SIZE = 24;          // "আরও দেখুন" চাপলে প্রতিবার কয়টি খবর বাড়বে

function getLang() {
  try { return localStorage.getItem("dop_lang") || "bn"; } catch (e) { return "bn"; }
}

function fixCat(a) {
  if (a.cat_ok) return a.category;
  const l = (a.link || "").toLowerCase();
  const rules = [
    ["aljazeera.com","বিশ্ব"],["bbc.co","বিশ্ব"],["ndtv.com","বিশ্ব"],
    ["haal.fashion","লাইফস্টাইল"],["/international","বিশ্ব"],
    ["/sports","খেলা"],["/entertainment","বিনোদন"],["/politics","রাজনীতি"],
    ["/technology","প্রযুক্তি"],["/business","অর্থনীতি"],["/economy","অর্থনীতি"]
  ];
  for (const [k, c] of rules) if (l.includes(k)) return c;
  return a.category || "বাংলাদেশ";
}

// বিশ্ব ও বাংলাদেশ ট্যাব উৎস (region) দেখে ঠিক হয়, ক্যাটাগরি দেখে নয়।
// তাই বিশ্বের রাজনীতি/অর্থনীতির খবরও "বিশ্ব" ট্যাবে আসবে।
function isWorld(a) {
  if (a.region) return a.region === "world";
  return fixCat(a) === "বিশ্ব" || /\/world\//i.test(a.link || "");
}

function inCategory(a, cat) {
  if (cat === "হোম") return true;
  if (cat === "বিশ্ব") return isWorld(a);
  if (cat === "বাংলাদেশ") return a.region ? a.region === "bd" : (!isWorld(a) && fixCat(a) === "বাংলাদেশ");
  return fixCat(a) === cat;
}

let ALL_ARTICLES = [];
let currentLang = getLang();
let currentCategory = "হোম";
let shownCount = PAGE_SIZE;

function t(key) {
  return TRANSLATIONS[currentLang]?.[key] || key;
}

function navText(cat) {
  const key = CAT_KEY[cat];
  return TRANSLATIONS[currentLang]?.nav?.[key] || cat;
}

function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr)) / 1000;
  if (isNaN(diff)) return "";
  if (diff < 60) return t("justNow");
  if (diff < 3600) return Math.floor(diff / 60) + " " + t("minAgo");
  if (diff < 86400) return Math.floor(diff / 3600) + " " + t("hourAgo");
  return Math.floor(diff / 86400) + " " + t("dayAgo");
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function safeUrl(u) {
  return /^https?:\/\//i.test(u || "") ? u : "";
}

// ছবি না থাকলে বা লোড না হলে ছবির জায়গাটাই সরে যায়, ভাঙা আইকন দেখা যায় না
function imgTag(cls, src) {
  const s = safeUrl(src);
  if (!s) return "";
  return `<img ${cls ? `class="${cls}" ` : ""}src="${escapeHtml(s)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`;
}

function applyLanguage() {
  const tr = TRANSLATIONS[currentLang];
  document.documentElement.lang = currentLang;
  document.body.classList.toggle("rtl", currentLang === "ar" || currentLang === "ur");
  document.getElementById("language").value = currentLang;

  const nav = document.getElementById("navInner");
  nav.innerHTML = CATEGORIES.map(cat => {
    const active = cat === currentCategory ? "active" : "";
    return `<a data-cat="${cat}" class="${active}">${navText(cat)}</a>`;
  }).join("");

  document.querySelectorAll("#navInner a").forEach(link => {
    link.onclick = function(e) {
      e.preventDefault();
      document.querySelectorAll("#navInner a").forEach(l => l.classList.remove("active"));
      this.classList.add("active");
      currentCategory = this.getAttribute("data-cat");
      shownCount = PAGE_SIZE;
      showCategory(currentCategory);
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
  });

  document.getElementById("breakingLabel").textContent = tr.breaking;
  document.getElementById("loadingTitle").textContent = tr.loadingTitle;
  document.getElementById("loadingSub").textContent = tr.loadingSub;
  document.getElementById("errorTitle").textContent = tr.errorTitle;
  document.getElementById("errorText").textContent = tr.errorText;
  document.getElementById("retryBtn").textContent = tr.retry;
  document.getElementById("footerDesc").textContent = tr.footerDesc;
  document.getElementById("moreBtn").textContent = tr.more;

  if (ALL_ARTICLES.length > 0) {
    showCategory(currentCategory);
  }
}

function showCategory(cat) {
  const tr = TRANSLATIONS[currentLang];
  const fm = document.getElementById("featuredMain");
  const sn = document.getElementById("sideNews");
  const ng = document.getElementById("newsGrid");
  const more = document.getElementById("moreBtn");

  if (cat === "হোম") {
    document.getElementById("mainTitle").textContent = tr.mainTitle;
    document.getElementById("gridTitle").textContent = tr.gridTitle;
  } else {
    const catName = navText(cat);
    document.getElementById("mainTitle").textContent = catName;
    document.getElementById("gridTitle").textContent = catName + " — " + tr.gridTitle;
  }

  const base = ALL_ARTICLES.filter(a => !HIDE_NON_BENGALI || currentLang !== "bn" || BN.test(a.title));
  const list = base.filter(a => inCategory(a, cat));

  if (!list || list.length === 0) {
    fm.innerHTML = "";
    sn.innerHTML = "";
    ng.innerHTML = `<div class="empty" style="grid-column:1/-1">${tr.empty}</div>`;
    more.style.display = "none";
    return;
  }

  const main = list[0];
  fm.innerHTML = `
    ${imgTag("", main.image)}
    <div class="featured-text">
      <h1>${escapeHtml(main.title)}</h1>
      <p class="news-description">${escapeHtml(main.summary || "")}</p>
      <div class="news-time">${timeAgo(main.published_at)}</div>
    </div>`;
  fm.onclick = function() { openModal(main); };

  const side = list.slice(1, 5);
  sn.innerHTML = side.map(a => `
    <div class="side-card">
      <h3>${escapeHtml(a.title)}</h3>
      <div class="news-time">${timeAgo(a.published_at)}</div>
    </div>`).join("");
  sn.querySelectorAll(".side-card").forEach((el, i) => {
    el.onclick = function() { openModal(side[i]); };
  });

  const gridAll = list.slice(5);
  const grid = gridAll.slice(0, shownCount);
  ng.innerHTML = grid.map(a => `
    <div class="news-card">
      ${imgTag("news-image", a.image)}
      <div class="news-content">
        <div class="news-title">${escapeHtml(a.title)}</div>
        <div class="news-description">${escapeHtml((a.summary || "").slice(0, 120))}${(a.summary || "").length > 120 ? "..." : ""}</div>
        <div class="news-time">${timeAgo(a.published_at)}</div>
      </div>
    </div>`).join("");
  ng.querySelectorAll(".news-card").forEach((el, i) => {
    el.onclick = function() { openModal(grid[i]); };
  });

  more.style.display = gridAll.length > shownCount ? "block" : "none";
}

document.getElementById("moreBtn").addEventListener("click", function() {
  shownCount += PAGE_SIZE;
  showCategory(currentCategory);
});

function openModal(a) {
  const img = document.getElementById("modalImage");
  const s = safeUrl(a.image);
  img.style.display = s ? "block" : "none";
  img.src = s;
  document.getElementById("modalTitle").textContent = a.title;

  const link = safeUrl(a.link);
  const srcHtml = link
    ? `<p style="margin-top:12px;font-size:14px"><a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer" style="color:#e50914;font-weight:bold">${escapeHtml(t("original"))}${a.source ? ": " + escapeHtml(a.source) : ""} ↗</a></p>`
    : "";

  document.getElementById("modalDescription").innerHTML = `
    <p>${escapeHtml(a.content || a.summary || "")}</p>
    <p style="margin-top:20px;color:#888;font-size:14px">
      ${escapeHtml(fixCat(a))} • ${timeAgo(a.published_at)}
    </p>
    ${srcHtml}`;
  document.getElementById("modal").style.display = "block";
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
  document.body.style.overflow = "";
}

document.getElementById("modalImage").addEventListener("error", function() {
  this.style.display = "none";
});
document.getElementById("modal").addEventListener("click", function(e) {
  if (e.target.id === "modal") closeModal();
});
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closeModal();
});

document.getElementById("language").addEventListener("change", function() {
  currentLang = this.value;
  try { localStorage.setItem("dop_lang", currentLang); } catch (e) {}
  applyLanguage();
});

async function loadNews() {
  const loading = document.getElementById("loading");
  const error = document.getElementById("error");
  const newsArea = document.getElementById("newsArea");

  loading.style.display = "block";
  error.style.display = "none";
  newsArea.style.display = "none";

  try {
    const res = await fetch("./news.json?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const articles = data.articles || [];
    if (articles.length === 0) throw new Error("Empty");

    ALL_ARTICLES = articles;
    applyLanguage();

    loading.style.display = "none";
    newsArea.style.display = "block";

    document.getElementById("ticker").textContent =
      articles.filter(a => BN.test(a.title)).slice(0, 8).map(a => a.title).join("  •  ");

  } catch (err) {
    console.error(err);
    loading.style.display = "none";
    error.style.display = "block";
  }
}

applyLanguage();
loadNews();
</script>
</body>
</html>
