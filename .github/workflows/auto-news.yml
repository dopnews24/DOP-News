name: Auto News Generator

on:
  schedule:
    # প্রতি ১ ঘণ্টা পরপর চলবে (UTC সময়ে)। প্রয়োজনে বদলান, যেমন "*/30 * * * *" মানে প্রতি ৩০ মিনিটে
    - cron: "0 * * * *"
  workflow_dispatch: {}   # Actions ট্যাব থেকে ম্যানুয়ালি "Run workflow" চাপার সুযোগ

permissions:
  contents: write   # news.json কমিট/পুশ করার জন্য দরকার

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests feedparser trafilatura

      - name: Run generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_news.py

      - name: Commit and push news.json
        run: |
          git config user.name "dopnews24-bot"
          git config user.email "actions@github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update news.json [auto]"
            git push
          fi
